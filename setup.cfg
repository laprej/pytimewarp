[metadata]
name = pytimewarp
author = Justin M. LaPre
author_email = justin@lapre.com
summary = Python Time Warp
url = https://github.com/laprej/pytimewarp
license = BSD 3-clause
classifier =
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: BSD
    Operating System :: OS Independent
    Programming Language :: Python

[files]
packages =
    pytimewarp

[entry_points]
console_scripts =
    pytimewarp = pytimewarp.runner:main

[tool:pytest]
# only collect the real tests, not copies under tmp/, dist/ or unpacked sdists
testpaths = tests
